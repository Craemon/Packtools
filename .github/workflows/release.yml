name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Core Fat JAR
        run: |
          cd core
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go CLI Binary
        run: |
          cd cli
          GOOS=linux GOARCH=amd64 go build -o ../dist/packtools-linux-amd64 main.go

      - name: Move Core JAR to Release Dist
        run: |
          mkdir -p dist
          cp core/build/libs/*-all.jar dist/core-all.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/core-all.jar
            dist/packtools-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
